<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Preview - FullTank</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recipe-preview.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="index.html" class="logo">
            Full<span>Tank</span>
        </a>

        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                <li><a href="admin-recipes.html">Dashboard</a></li>
            </ul>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>

    </header>


    <!-- Preview Section -->
    <section class="preview-section">

        <div class="preview-container">

            <!-- Page Heading -->
            <div class="preview-heading">

                <p class="preview-small-title">REVIEW YOUR CREATION</p>

                <h1>Recipe Preview</h1>

                <p>
                    Take a look at your recipe before adding it
                    to the FullTank collection.
                </p>

            </div>


            <!-- Recipe Card -->
            <div class="preview-card">

                <!-- Recipe Image (empty until an image is chosen) -->
                <div class="preview-image">

                    <img id="preview-img" alt="Recipe image" style="display: none;">

                </div>


                <!-- Recipe Information -->
                <div class="preview-info">

                    <span class="recipe-category" id="preview-course"></span>

                    <h2 id="preview-name"></h2>

                    <p class="recipe-description" id="preview-description"></p>

                </div>


                <!-- Ingredients + Instructions -->
                <div class="preview-content">

                    <div class="preview-ingredients">

                        <h3>Ingredients</h3>

                        <ul class="ingredients-list" id="preview-ingredients"></ul>

                    </div>


                    <div class="preview-instructions">

                        <h3>Cooking Instructions</h3>

                        <ol id="preview-instructions"></ol>

                    </div>

                </div>


                <!-- Preview Actions -->
                <div class="preview-actions">

                    <a href="recipe-form.html" class="edit-recipe-btn">
                        ← Edit Recipe
                    </a>

                    <a href="admin-recipes.html" class="confirm-recipe-btn">
                        Confirm Recipe
                    </a>

                </div>

            </div>

        </div>

    </section>


    <script>
        // Read the recipe saved by the form page
        var data = JSON.parse(sessionStorage.getItem("recipeData"));

        if (!data) {
            
            window.location.href = "recipe-form.html";
        } else {
            document.getElementById("preview-course").textContent = (data["course"] || "").toUpperCase();
            document.getElementById("preview-name").textContent = data["recipe-name"] || "";
            document.getElementById("preview-description").textContent = data["description"] || "";

        
            if (data["image"]) {
                var previewImg = document.getElementById("preview-img");
                previewImg.src = data["image"];
                previewImg.style.display = "block";
            }

            
            var ingredientsList = document.getElementById("preview-ingredients");
            var i = 1;
            while (data["ingredient-" + i] !== undefined) {
                var name = data["ingredient-" + i].trim();
                var qty = (data["quantity-" + i] || "").trim();
                if (name) {
                    var li = document.createElement("li");
                    var nameSpan = document.createElement("span");
                    var qtySpan = document.createElement("span");
                    nameSpan.textContent = name;
                    qtySpan.textContent = qty;
                    li.appendChild(nameSpan);
                    li.appendChild(qtySpan);
                    ingredientsList.appendChild(li);
                }
                i++;
            }

            var stepsList = document.getElementById("preview-instructions");
            (data["instructions"] || "").split("\n").forEach(function (line) {
                line = line.trim();
                if (line) {
                    var li = document.createElement("li");
                    li.textContent = line;
                    stepsList.appendChild(li);
                }
            });
        }
    </script>

</body>

</html>
